<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .con{
            height: 100vh;
            border: 1px solid black;
            display: flex;
        }
        .box{
            width: 25%;
            /* border: 1px solid black; */
        }
        img{
            width: 100%;
        }
        *{
            text-transform: capitalize;
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <h1 align="center">dynamic gallery</h1>
    <div class="con">
        <div class="box">
            <img src="image1.JPG" alt="">
            <img src="image2.JPG" alt="">
            <img src="image3.JPG" alt="">
            <img src="image4.JPG" alt="">
        </div>
        <div class="box">
            <img src="image4.JPG" alt="">
            <img src="image1.JPG" alt="">
            <img src="image2.JPG" alt="">
            <img src="image3.JPG" alt="">
        </div>
        <div class="box">
            <img src="image2.JPG" alt="">
            <img src="image1.JPG" alt="">
            <img src="image3.JPG" alt="">
            <img src="image4.JPG" alt="">
        </div>
        <div class="box">
            <img src="image3.JPG" alt="">
            <img src="image4.JPG" alt="">
            <img src="image1.JPG" alt="">
            <img src="image2.JPG" alt="">
        </div>
    </div>
</body>
</html>
